<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HQ Tax | Command Center Prototype</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Arial;color:#172e46;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}.shell{display:flex;min-height:100vh}.side{width:245px;background:#102c46;color:white;padding:24px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{font-size:21px;font-weight:800;margin:6px 12px 4px}.subbrand{color:#a7c3d9;font-size:11px;margin:0 12px 30px;letter-spacing:.8px}.nav{display:block;width:100%;text-align:left;border:0;background:transparent;color:#b8cadb;padding:13px 15px;border-radius:10px;margin:3px 0}.nav:hover,.nav.active{background:#215172;color:#fff}.sidefoot{position:absolute;bottom:20px;left:24px;right:20px;color:#b5cbdc;font-size:12px;line-height:1.6}.main{flex:1;min-width:0}.top{background:white;border-bottom:1px solid #dce5ee;padding:20px 34px;display:flex;justify-content:space-between;align-items:center;gap:15px}.top strong{font-size:18px}.content{padding:30px 34px;max-width:1500px;margin:auto}.eyebrow{font-size:12px;color:#6d8297;text-transform:uppercase;letter-spacing:1px;font-weight:700}h1{font-size:29px;margin:7px 0}h2{font-size:18px;margin:0 0 18px}h3{margin:0 0 10px;font-size:15px}.muted{color:#72869a}.small{font-size:12px}.notice{background:#fff8e9;border:1px solid #f3dba4;border-radius:12px;padding:14px 17px;margin:0 0 22px;font-size:13px;color:#755922}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.two{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e3eaf1;border-radius:16px;padding:22px;box-shadow:0 4px 18px #17355009;margin-bottom:18px}.metric{font-size:32px;font-weight:800;color:#116594;margin:10px 0 3px}.metriclabel{color:#698097;font-size:13px}.btn{background:#116c9c;color:white;border:1px solid #116c9c;padding:10px 14px;border-radius:9px;font-weight:650}.btn:hover{background:#0c5278}.btn.alt{background:white;color:#164b70;border-color:#d0dfeb}.btn.danger{background:#fff;color:#a33d42;border-color:#f0c6c9}.btn.sm{padding:6px 10px;font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.field{padding:10px 12px;border:1px solid #ccd9e6;border-radius:9px;background:white;color:#17334d;min-width:0}.field:focus{outline:2px solid #b7dced}.toolbar .field{max-width:260px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;color:#6d8297;font-weight:650;background:#f8fafc}td,th{padding:13px 12px;border-bottom:1px solid #e8eef4;white-space:nowrap}tr:last-child td{border:0}.pill{display:inline-block;border-radius:20px;background:#eaf3fa;color:#225e80;font-size:11px;padding:5px 9px;font-weight:700}.pill.green{background:#e5f7ee;color:#17714b}.pill.orange{background:#fff0d9;color:#956017}.pill.red{background:#fdebed;color:#a33c4b}.link{color:#126b9d;font-weight:700;border:0;background:none;padding:0}.progress{height:8px;border-radius:10px;background:#e9eff5;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#20a5a2;border-radius:10px}.stack{display:flex;flex-direction:column;gap:12px}.item{border:1px solid #e3eaf1;border-radius:10px;padding:13px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item p{margin:4px 0 0}.clienthead{display:flex;justify-content:space-between;align-items:center;gap:10px}.flex{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.formgrid label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#667d91;font-weight:700}.formgrid input,.formgrid select,.formgrid textarea{width:100%}.wide{grid-column:1/-1}.barrow{display:flex;align-items:center;gap:12px;margin:12px 0}.barrow span{min-width:115px;font-size:12px}.barrow .progress{flex:1}.empty{text-align:center;padding:28px;color:#7a8d9f}.clientportal{max-width:940px;margin:auto}.portalhero{background:linear-gradient(120deg,#103a58,#116b8c);color:white;padding:28px;border-radius:17px;margin-bottom:18px}.portalhero .muted{color:#c2dce9}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{border:1px solid #d2e1eb;background:white;color:#34536a;border-radius:9px;padding:10px 13px}.tab.active{background:#116c9c;color:white}.modalback{position:fixed;inset:0;background:#071e32a6;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.modal{background:white;border-radius:16px;width:min(580px,100%);padding:24px;max-height:90vh;overflow:auto}.close{float:right;border:0;background:none;font-size:22px}.topright{display:flex;gap:10px;align-items:center}.hamb{display:none}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.side{width:205px}.content{padding:22px}}@media(max-width:650px){.side{display:none;position:fixed;z-index:5;width:245px}.side.show{display:block}.hamb{display:inline-block}.top{padding:15px}.content{padding:16px}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:16px}.metric{font-size:26px}.formgrid{grid-template-columns:1fr}.wide{grid-column:auto}.topright{flex-wrap:wrap}.topright .btn{font-size:11px;padding:8px}}
.actiongrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.actiongrid button{white-space:normal;text-align:left;min-height:46px}.chatlog{height:390px;overflow:auto;background:#f4f7fb;border-radius:12px;padding:16px;margin-bottom:15px}.chatbubble{max-width:90%;background:#fff;border:1px solid #dce5ee;border-radius:12px;padding:12px 14px;margin:10px 0;white-space:pre-wrap}.chatbubble.mine{margin-left:auto;background:#e0f3f3}.chatbubble p{margin:7px 0 0;line-height:1.55}.summarypre{white-space:pre-wrap;line-height:1.65;font-family:inherit;background:#f3f7fb;padding:16px;border-radius:10px}.warningline{margin:5px 0;color:#a65a15}.card{margin-bottom:18px}@media(max-width:750px){.actiongrid{grid-template-columns:1fr}.chatlog{height:300px}}
</style></head><body><div id="app"></div><script>
// Public demonstration only: all records are fictional, stored in this browser, and not securely authenticated.
const KEY='hq-tax-command-center-v3';const statuses=['Not started','Waiting on documents','In preparation','Ready for review','Client signature','E-filed','Accepted','Completed'];const docTemplates={'Individual · 1040':['Photo ID','Prior-year return','W-2','1099-INT / DIV','1099-R','1098-T','Dependent information'],'Self-employed · Schedule C':['Photo ID','Prior-year return','Business income summary','Business expense summary','1099-NEC / K','Mileage log','Estimated tax payments'],'Business · 1120-S':['Prior-year return','Profit & loss','Balance sheet','Payroll reports','Shareholder details','1099 filing summary'],'Business · 1065':['Prior-year return','Profit & loss','Balance sheet','Partner details','Capital accounts','1099 filing summary']};
const names=['Ethan Brooks','Sophia Rivera','Noah Williams','Ava Patel','Marcus Bennett','Olivia Chen','Liam Parker','Isabella Torres','James Wilson','Mia Johnson','Lucas Anderson','Amelia Davis','Henry Taylor','Charlotte Lee','Benjamin Scott'];const types=Object.keys(docTemplates);const today=()=>new Date().toISOString().slice(0,10);function seed(){let clients=names.map((name,i)=>({id:i+1,name,type:i%5===3?types[1]:i%7===5?types[2]:types[0],status:statuses[[0,1,7,2,3,1,2,4,0,3,1,2,5,1,7][i]],staff:['admin','Maria','James'][i%3],email:'demo'+(i+1)+'@example.invalid',docs:[],notes:'',created:today()}));clients.forEach((c,i)=>{c.docs=docTemplates[c.type].map((name,j)=>({name,status:(i+j)%4===0?'Received':(i+j)%3===0?'Requested':'Missing'}))});return {clients,staff:['admin','Maria','James'],tasks:[{id:1,clientId:1,title:'Review outstanding documents',assignee:'admin',due:today(),done:false},{id:2,clientId:4,title:'Verify business expense summary',assignee:'Maria',due:today(),done:false},{id:3,clientId:5,title:'Review return for signature',assignee:'James',due:today(),done:true}],messages:[{id:1,clientId:1,from:'Office',text:'Please review your missing document checklist.',date:today()}],appointments:[{id:1,clientId:2,date:today(),time:'14:00',type:'Tax consultation',staff:'Maria'}],audit:[{at:new Date().toLocaleString(),text:'Fictional training workspace initialized'}]}}let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}let view='season',selected=1,modal='',portalId=1,portalTab='overview',search='',filter='All',toast='';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const client=id=>db.clients.find(c=>c.id===Number(id));const save=(event)=>{if(event)db.audit.unshift({at:new Date().toLocaleString(),text:event});localStorage.setItem(KEY,JSON.stringify(db));render()};const count=s=>db.clients.filter(c=>c.status===s).length;const pending=c=>c.docs.filter(d=>d.status!=='Received'&&d.status!=='Not applicable').length;const badge=s=>'<span class="pill '+(s==='Completed'||s==='Accepted'||s==='Received'?'green':s==='Missing'||s==='Waiting on documents'?'red':s==='Requested'||s==='Ready for review'?'orange':'')+'">'+esc(s)+'</span>';const btn=(label,act,cls='alt')=>`<button class="btn ${cls}" onclick="${act}">${label}</button>`;function header(title,sub,action=''){return `<div class="clienthead" style="margin-bottom:22px"><div><div class="eyebrow">HQ Tax & Financial · Demo workspace</div><h1>${title}</h1><div class="muted">${sub}</div></div><div>${action}</div></div>`}function metric(label,num,note){return `<div class="card"><div class="metriclabel">${label}</div><div class="metric">${num}</div><div class="muted small">${note}</div></div>`}function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}" class="empty">No records found</td></tr>`}</tbody></table></div>`}function clientRows(cs){return cs.map(c=>`<tr><td><button class="link" onclick="openClient(${c.id})">${esc(c.name)}</button></td><td>${esc(c.type)}</td><td>${esc(c.staff)}</td><td>${badge(c.status)}</td><td>${pending(c)} outstanding</td><td>${btn('Open',`openClient(${c.id})`,'alt sm')}</td></tr>`)}
function dashboard(){let outstanding=db.clients.reduce((n,c)=>n+pending(c),0);return header('Office dashboard','A clear view of workload, tax returns, and follow-ups',btn('+ Add client',"showModal('client')",'primary'))+`<div class="grid">${metric('Active client files',db.clients.length,'Fictional client records')}${metric('Waiting on documents',count('Waiting on documents'),'Needs client follow-up')}${metric('Ready for review',count('Ready for review'),'Preparer review queue')}${metric('Outstanding documents',outstanding,'Missing or requested')}</div><div class="two"><div class="card"><h2>Priority follow-ups</h2><div class="stack">${db.clients.filter(c=>pending(c)>0).sort((a,b)=>pending(b)-pending(a)).slice(0,6).map(c=>`<div class="item"><div><button class="link" onclick="openClient(${c.id})">${esc(c.name)}</button><p class="muted small">${pending(c)} outstanding documents · ${esc(c.staff)}</p></div>${badge(c.status)}</div>`).join('')||'<p class="empty">All clear</p>'}</div></div><div class="card"><h2>Return pipeline</h2>${statuses.map(s=>`<div class="barrow"><span>${esc(s)}</span><div class="progress"><div style="width:${db.clients.length?count(s)/db.clients.length*100:0}%"></div></div><b>${count(s)}</b></div>`).join('')}</div></div><div class="card"><div class="clienthead"><h2>Recent client files</h2>${btn('View all clients',"go('clients')")}</div>${table(['Client','Return type','Assigned','Status','Documents',''],clientRows(db.clients.slice(-8).reverse()))}</div>`}
function clientsPage(){let cs=db.clients.filter(c=>(c.name+' '+c.type+' '+c.staff).toLowerCase().includes(search.toLowerCase())&&(filter==='All'||c.status===filter));return header('Client management','Organize clients, assignments, and return progress',btn('+ New client',"showModal('client')",'primary'))+`<div class="card"><div class="toolbar"><input class="field" placeholder="Search client, type, staff..." value="${esc(search)}" oninput="search=this.value;refreshClientTable()"><select class="field" onchange="filter=this.value;refreshClientTable()"><option>All</option>${statuses.map(s=>`<option ${filter===s?'selected':''}>${s}</option>`).join('')}</select><span class="muted small" id="resultcount">${cs.length} clients</span></div><div id="clienttable">${table(['Client','Return type','Assigned','Status','Documents',''],clientRows(cs))}</div></div>`}function refreshClientTable(){let cs=db.clients.filter(c=>(c.name+' '+c.type+' '+c.staff).toLowerCase().includes(search.toLowerCase())&&(filter==='All'||c.status===filter));$('#clienttable').innerHTML=table(['Client','Return type','Assigned','Status','Documents',''],clientRows(cs));$('#resultcount').textContent=cs.length+' clients'}
function openClient(id){selected=id;go('detail')}function detail(){let c=client(selected);if(!c)return go('clients');let tasks=db.tasks.filter(t=>t.clientId===c.id);return `<button class="link" onclick="go('clients')">← Back to clients</button>`+header(esc(c.name),esc(c.type)+' · Fictional client #'+c.id,btn('Preview client portal',`portalId=${c.id};portalTab='overview';go('portal')`))+`<div class="card"><h2>Return workflow</h2><div class="toolbar"><label class="small">Status<br><select id="cstatus" class="field">${statuses.map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></label><label class="small">Assigned staff<br><select id="cstaff" class="field">${db.staff.map(s=>`<option ${s===c.staff?'selected':''}>${esc(s)}</option>`).join('')}</select></label>${btn('Save changes',`updateClient(${c.id})`,'primary')}</div><p class="muted small">Statuses are manually recorded; E-filed and Accepted are NOT verified with the IRS.</p></div><div class="two"><div class="card"><h2>Document checklist</h2><div class="stack">${c.docs.map((d,i)=>`<div class="item"><strong>${esc(d.name)}</strong><select class="field" onchange="updateDoc(${c.id},${i},this.value)">${['Missing','Requested','Received','Not applicable'].map(s=>`<option ${d.status===s?'selected':''}>${s}</option>`).join('')}</select></div>`).join('')}</div><div class="toolbar" style="margin-top:16px"><input class="field" id="newdoc" placeholder="Additional document type">${btn('+ Add document',`addDoc(${c.id})`)}</div></div><div class="card"><h2>Client tasks</h2><div class="stack">${tasks.map(t=>`<div class="item"><div><b>${esc(t.title)}</b><p class="small muted">${esc(t.assignee)} · ${esc(t.due)}</p></div>${t.done?badge('Completed'):btn('Complete',`finishTask(${t.id})`,'alt sm')}</div>`).join('')||'<div class="empty">No tasks</div>'}</div><div class="toolbar" style="margin-top:16px"><input class="field" id="quicktask" placeholder="New task">${btn('+ Add',`quickTask(${c.id})`)}</div><h2 style="margin-top:30px">Internal notes</h2><textarea class="field" style="width:100%;height:110px" id="notes" placeholder="Fictional internal notes only">${esc(c.notes)}</textarea><div style="margin-top:10px">${btn('Save notes',`saveNotes(${c.id})`)}</div></div></div>`}
function tasksPage(){return header('Task center','Keep work moving and clarify ownership',btn('+ Add task',"showModal('task')",'primary'))+`<div class="grid">${metric('Open tasks',db.tasks.filter(t=>!t.done).length,'Needs action')}${metric('Completed',db.tasks.filter(t=>t.done).length,'Recorded as done')}${metric('Due today',db.tasks.filter(t=>!t.done&&t.due<=today()).length,'Due today or earlier')}${metric('Total tasks',db.tasks.length,'All assignments')}</div><div class="card">${table(['Task','Client','Assigned','Due','Status','Action'],db.tasks.map(t=>`<tr><td>${esc(t.title)}</td><td>${esc(client(t.clientId)?.name||'Office')}</td><td>${esc(t.assignee)}</td><td>${esc(t.due)}</td><td>${badge(t.done?'Completed':'Open')}</td><td>${btn(t.done?'Reopen':'Complete',`toggleTask(${t.id})`,'alt sm')}</td></tr>`))}</div>`}
function messagesPage(){return header('Communication center','A demonstration message log — not email or SMS',btn('+ Log message',"showModal('message')",'primary'))+`<div class="card">${table(['Date','Client','From','Message'],db.messages.slice().reverse().map(m=>`<tr><td>${esc(m.date)}</td><td>${esc(client(m.clientId)?.name)}</td><td>${esc(m.from)}</td><td style="white-space:normal;min-width:250px">${esc(m.text)}</td></tr>`))}</div>`}function appointmentsPage(){return header('Appointments','Coordinate tax consultations and client meetings',btn('+ Schedule appointment',"showModal('appointment')",'primary'))+`<div class="card">${table(['Date','Time','Client','Type','Staff',''],db.appointments.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.time)}</td><td>${esc(client(a.clientId)?.name)}</td><td>${esc(a.type)}</td><td>${esc(a.staff)}</td><td>${btn('Cancel',`removeAppointment(${a.id})`,'danger sm')}</td></tr>`))}</div>`}function analyticsPage(){let total=db.clients.length,complete=db.clients.filter(c=>['Accepted','Completed'].includes(c.status)).length;return header('Office analytics','Identify workload bottlenecks and document delays')+`<div class="grid">${metric('Completion rate',total?Math.round(complete/total*100)+'%':'0%','Accepted or completed')}${metric('Returns in progress',count('In preparation'),'Currently being prepared')}${metric('Client signature',count('Client signature'),'Awaiting signatures')}${metric('Open tasks',db.tasks.filter(t=>!t.done).length,'Office action items')}</div><div class="two"><div class="card"><h2>Workload by staff</h2>${db.staff.map(s=>`<div class="barrow"><span>${esc(s)}</span><div class="progress"><div style="width:${total?db.clients.filter(c=>c.staff===s).length/total*100:0}%"></div></div><b>${db.clients.filter(c=>c.staff===s).length}</b></div>`).join('')}</div><div class="card"><h2>Document collection</h2>${['Received','Requested','Missing','Not applicable'].map(s=>{let all=db.clients.flatMap(c=>c.docs),n=all.filter(d=>d.status===s).length;return `<div class="barrow"><span>${s}</span><div class="progress"><div style="width:${all.length?n/all.length*100:0}%"></div></div><b>${n}</b></div>`}).join('')}</div></div>`}function staffPage(){return header('Staff & responsibilities','See assignments and balance the workload',btn('+ Add demo staff',"showModal('staff')",'primary'))+`<div class="three">${db.staff.map(s=>`<div class="card"><h2>${esc(s)}</h2><div class="metric">${db.clients.filter(c=>c.staff===s).length}</div><div class="muted small">Assigned clients</div><p>${db.tasks.filter(t=>t.assignee===s&&!t.done).length} open tasks</p></div>`).join('')}</div>`}function auditPage(){return header('Activity history','Browser-local demonstration activity — not a tamper-proof audit trail')+`<div class="card">${table(['Time','Activity'],db.audit.map(a=>`<tr><td>${esc(a.at)}</td><td style="white-space:normal">${esc(a.text)}</td></tr>`))}</div>`}
function portal(){let c=client(portalId)||db.clients[0];if(!c)return '<p>No demo clients available</p>';let received=c.docs.filter(d=>d.status==='Received'||d.status==='Not applicable').length,pc=c.docs.length?Math.round(received/c.docs.length*100):100;return `<div class="clientportal">${header('Client portal preview','This is what a fictional client could see',btn('Return to office',"go('dashboard')"))}<div class="notice">Preview only: this is NOT a secure client login. All fictional client records remain accessible in this browser. Do not share this as a real client portal.</div><div class="toolbar"><label>Preview client: <select class="field" onchange="portalId=Number(this.value);render()">${db.clients.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div><div class="portalhero"><div class="eyebrow" style="color:#9fd5e7">Welcome back</div><h1>${esc(c.name)}</h1><p class="muted">Your ${esc(c.type)} return</p><div>${badge(c.status)}</div></div><div class="tabs">${[['overview','Overview'],['documents','Documents'],['messages','Messages'],['appointments','Appointments']].map(([v,l])=>`<button class="tab ${portalTab===v?'active':''}" onclick="portalTab='${v}';render()">${l}</button>`).join('')}</div>${portalTab==='overview'?`<div class="grid" style="grid-template-columns:repeat(2,1fr)">${metric('Document readiness',pc+'%','Checklist completion')}${metric('Items still needed',pending(c),'Missing or requested')}</div><div class="card"><h2>What happens next?</h2><p>Track your document checklist and follow up with the office on outstanding items.</p><p class="muted small">The status shown is manually updated by office staff, not verified with the IRS.</p>${btn('View document checklist',"portalTab='documents';render()",'primary')}</div>`:portalTab==='documents'?`<div class="card"><h2>Your document checklist</h2><div class="stack">${c.docs.map(d=>`<div class="item"><b>${esc(d.name)}</b>${badge(d.status)}</div>`).join('')}</div><p class="muted small">Secure document uploads are not enabled in this GitHub Pages prototype. Do not upload or enter tax documents here.</p></div>`:portalTab==='messages'?`<div class="card"><h2>Messages from the office</h2><div class="stack">${db.messages.filter(m=>m.clientId===c.id).map(m=>`<div class="item"><div><b>${esc(m.from)}</b><p>${esc(m.text)}</p><span class="muted small">${esc(m.date)}</span></div></div>`).join('')||'<p class="empty">No messages yet</p>'}</div><p class="muted small">Demonstration message history only. Messages are not delivered to clients.</p></div>`:`<div class="card"><h2>Scheduled consultations</h2><div class="stack">${db.appointments.filter(a=>a.clientId===c.id).map(a=>`<div class="item"><div><b>${esc(a.type)}</b><p class="muted small">${esc(a.date)} at ${esc(a.time)} · ${esc(a.staff)}</p></div></div>`).join('')||'<p class="empty">No appointments scheduled</p>'}</div><p class="muted small">Appointments are local demo records, not confirmed bookings.</p></div>`}</div>`}
function settingsPage(){return header('Demo settings','Manage your local prototype data')+`<div class="card"><h2>Data controls</h2><p>Changes are saved in this browser using localStorage. They are not shared across devices or staff accounts.</p><div class="toolbar">${btn('Export demo JSON',"exportData()",'primary')}${btn('Import demo JSON',"$('#importfile').click()")}${btn('Restore sample data',"resetDemo()",'danger')}<input type="file" id="importfile" accept="application/json" style="display:none" onchange="importData(this)"></div><p class="muted small">Import only JSON exports created by this prototype. Never import real taxpayer data.</p></div><div class="card"><h2>Production readiness</h2><p>Before real use, build server-side authentication, role-based authorization, encrypted database and file storage, secure client uploads, session management, backups, monitored audit logs, consent and retention controls, and appropriate tax-data security procedures. GitHub Pages alone cannot provide these safeguards.</p></div>`}
function showModal(type){modal=type;render()}function formField(label,id,type='text',opts=''){return `<label>${label}${type==='select'?`<select class="field" id="${id}">${opts}</select>`:type==='textarea'?`<textarea class="field" id="${id}" rows="3"></textarea>`:`<input class="field" id="${id}" type="${type}" ${type==='date'?`value="${today()}"`:''} required>`}</label>`}function selectOpts(arr){return arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}function clientOpts(){return db.clients.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}function modalHtml(){if(!modal)return '';let forms={client:formField('Fictional client name','fName')+formField('Return type','fType','select',selectOpts(types))+formField('Assigned staff','fStaff','select',selectOpts(db.staff)),task:formField('Task description','fTitle')+formField('Client','fClient','select',clientOpts())+formField('Assigned staff','fStaff','select',selectOpts(db.staff))+formField('Due date','fDate','date'),message:formField('Client','fClient','select',clientOpts())+formField('From','fFrom','select',selectOpts(['Office','Client']))+`<div class="wide">${formField('Message text','fText','textarea')}</div>`,appointment:formField('Client','fClient','select',clientOpts())+formField('Appointment type','fType','select',selectOpts(['Tax consultation','Document review','Return signing','Follow-up']))+formField('Date','fDate','date')+formField('Time','fTime','time')+formField('Assigned staff','fStaff','select',selectOpts(db.staff)),staff:formField('Fictional staff name','fName')};return `<div class="modalback" onclick="if(event.target===this){modal='';render()}"><div class="modal"><button class="close" onclick="modal='';render()">×</button><h2>Add ${esc(modal)}</h2><p class="muted small">Fictional demonstration data only.</p><form onsubmit="submitModal(event)"><div class="formgrid">${forms[modal]}</div><div class="toolbar" style="margin-top:20px">${btn('Save',"",'primary').replace('<button','<button type="submit"').replace('onclick=""','')}${btn('Cancel',"modal='';render()")}</div></form></div></div>`}
function submitModal(e){e.preventDefault();let v=id=>$('#'+id)?.value.trim();if(modal==='client'){if(!v('fName'))return;let id=Math.max(0,...db.clients.map(c=>c.id))+1;db.clients.push({id,name:v('fName'),type:v('fType'),staff:v('fStaff'),status:'Not started',email:'',docs:docTemplates[v('fType')].map(name=>({name,status:'Missing'})),notes:'',created:today()});selected=id}else if(modal==='task'){db.tasks.push({id:Date.now(),title:v('fTitle'),clientId:Number(v('fClient')),assignee:v('fStaff'),due:v('fDate'),done:false})}else if(modal==='message'){db.messages.push({id:Date.now(),clientId:Number(v('fClient')),from:v('fFrom'),text:v('fText'),date:today()})}else if(modal==='appointment'){db.appointments.push({id:Date.now(),clientId:Number(v('fClient')),type:v('fType'),date:v('fDate'),time:v('fTime'),staff:v('fStaff')})}else if(modal==='staff'){if(!db.staff.includes(v('fName')))db.staff.push(v('fName'))}let action='Added fictional '+modal;modal='';save(action)}function updateClient(id){let c=client(id);c.status=$('#cstatus').value;c.staff=$('#cstaff').value;save('Updated workflow for '+c.name)}function updateDoc(id,i,status){let c=client(id);c.docs[i].status=status;save('Updated '+c.docs[i].name+' checklist for '+c.name)}function addDoc(id){let n=$('#newdoc').value.trim();if(!n)return;client(id).docs.push({name:n,status:'Missing'});save('Added document checklist item for '+client(id).name)}function quickTask(id){let t=$('#quicktask').value.trim();if(!t)return;db.tasks.push({id:Date.now(),title:t,clientId:id,assignee:client(id).staff,due:today(),done:false});save('Created task for '+client(id).name)}function finishTask(id){db.tasks.find(t=>t.id===id).done=true;save('Completed task #'+id)}function toggleTask(id){let t=db.tasks.find(t=>t.id===id);t.done=!t.done;save('Changed task status #'+id)}function saveNotes(id){client(id).notes=$('#notes').value;save('Updated notes for '+client(id).name)}function removeAppointment(id){if(!confirm('Cancel this fictional appointment?'))return;db.appointments=db.appointments.filter(a=>a.id!==id);save('Cancelled appointment #'+id)}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='hq-tax-demo-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!Array.isArray(x.clients)||!Array.isArray(x.staff)||!Array.isArray(x.tasks)||!Array.isArray(x.messages)||!Array.isArray(x.appointments)||!Array.isArray(x.audit))throw Error('Invalid format');db=x;save('Imported demo JSON')}catch(e){alert('Could not import: '+e.message)}};reader.readAsText(f)}function resetDemo(){if(!confirm('Replace all browser-local demo data with fresh sample records?'))return;db=seed();save('Reset demo workspace')}
// Version 3: productivity features. Assistant is deterministic, not an AI model.
let assistantHistory=[{role:'assistant',text:'Hi! I am the HQ Workflow Assistant (demo). Ask me about today’s priorities, missing documents, workload, follow-ups, or next steps. I use only fictional records in this browser.'}];
let seasonFilter='all',intakeType='Individual · 1040',intakeAnswers={};
function pct(n,d){return d?Math.round(n/d*100):0}
function priorityClients(){return db.clients.map(c=>({...c,open:pending(c),openTasks:db.tasks.filter(t=>t.clientId===c.id&&!t.done).length})).sort((a,b)=>(b.open+b.openTasks*2)-(a.open+a.openTasks*2))}
function seasonPage(){let all=priorityClients(),need=all.filter(c=>c.open>0),late=db.tasks.filter(t=>!t.done&&t.due<=today()),ready=db.clients.filter(c=>c.status==='Ready for review');return header('Tax season cockpit','A single place to decide what to do next',btn('Create follow-up batch',"go('followups')",'primary'))+`<div class="grid">${metric('Needs attention',need.length,'Clients with outstanding items')}${metric('Tasks due',late.length,'Today or earlier')}${metric('Review queue',ready.length,'Returns waiting for review')}${metric('Checklist progress',pct(db.clients.reduce((s,c)=>s+c.docs.filter(d=>d.status==='Received'||d.status==='Not applicable').length,0),db.clients.reduce((s,c)=>s+c.docs.length,0))+'%','All document checklist items')}</div><div class="two"><div class="card"><h2>Recommended next actions</h2><div class="stack">${all.slice(0,7).map(c=>`<div class="item"><div><button class="link" onclick="openClient(${c.id})">${esc(c.name)}</button><p class="muted small">${c.open} document items · ${c.openTasks} open tasks</p></div>${btn('Open',`openClient(${c.id})`,'alt sm')}</div>`).join('')}</div></div><div class="card"><h2>Quick actions</h2><div class="actiongrid">${btn('✉ Draft missing-doc reminders',"go('followups')")}${btn('✓ Run quality checks',"go('quality')")}${btn('＋ New intake',"go('intake')")}${btn('◈ Ask workflow assistant',"go('assistant')")}${btn('▤ View pipeline',"go('clients')")}${btn('◷ Manage appointments',"go('appointments')")}</div><p class="muted small">Recommendations use checklist and task counts, not automated tax judgment.</p></div></div>`}
function followupText(c){let missing=c.docs.filter(d=>d.status==='Missing'||d.status==='Requested').map(d=>d.name);return `Subject: HQ Tax & Financial — documents needed for your tax return\n\nHello ${c.name.split(' ')[0]},\n\nWe are following up on your tax preparation. Our checklist currently shows these items as outstanding:\n${missing.map(d=>'• '+d).join('\n')||'• No outstanding items listed'}\n\nPlease contact our office to arrange secure delivery of the documents. For your privacy, do not send Social Security numbers, tax forms, or other sensitive information by regular email.\n\nThank you,\nHQ Tax & Financial\n\n[Draft only — staff must review before sending]`}
function followupsPage(){let cs=db.clients.filter(c=>pending(c)>0);return header('Follow-up studio','Prepare personalized document reminders in seconds — review before sending')+`<div class="card"><h2>Outstanding client requests</h2><p class="muted small">No emails or texts are sent from this demo. Copy drafts only; do not include actual sensitive information.</p>${table(['Client','Outstanding','Action'],cs.map(c=>`<tr><td><button class="link" onclick="openClient(${c.id})">${esc(c.name)}</button></td><td>${pending(c)} items</td><td>${btn('Create draft',`draftReminder(${c.id})`,'alt sm')}</td></tr>`))}</div><div class="card"><h2>Draft editor</h2><textarea class="field" id="reminderDraft" style="width:100%;min-height:260px" placeholder="Select a client above to generate a reminder..."></textarea><div class="toolbar" style="margin-top:12px">${btn('Copy draft',"copyReminder()",'primary')}${btn('Log draft for selected client',"logReminder()")}</div><p class="muted small">Logging records a draft activity only, not delivery. Staff must approve all outgoing communications.</p></div>`}
let draftClientId=null;function draftReminder(id){draftClientId=id;$('#reminderDraft').value=followupText(client(id));$('#reminderDraft').focus()}function copyReminder(){let t=$('#reminderDraft').value;if(!t)return alert('Create a draft first.');navigator.clipboard?.writeText(t).then(()=>alert('Draft copied.')).catch(()=>alert('Select and copy the draft manually.'))}function logReminder(){if(!draftClientId||!$('#reminderDraft').value.trim())return alert('Create a draft first.');db.messages.push({id:Date.now(),clientId:draftClientId,from:'Office (draft only)',text:'Document reminder drafted for staff review; not sent.',date:today()});save('Prepared unsent reminder for '+client(draftClientId).name)}
function qualityFlags(c){let f=[];if(pending(c))f.push(`${pending(c)} outstanding checklist item(s)`);if(c.status==='Ready for review'&&pending(c))f.push('Review status despite incomplete checklist');if(['E-filed','Accepted','Completed'].includes(c.status)&&pending(c))f.push('Advanced status with outstanding documents');if(!db.tasks.some(t=>t.clientId===c.id))f.push('No client-specific task recorded');return f}
function qualityPage(){let flagged=db.clients.map(c=>({c,f:qualityFlags(c)})).filter(x=>x.f.length);return header('Quality control','Catch workflow gaps before a return moves forward')+`<div class="grid">${metric('Files flagged',flagged.length,'Workflow warnings')}${metric('Ready for review',count('Ready for review'),'Manual review still required')}${metric('Open tasks',db.tasks.filter(t=>!t.done).length,'Outstanding staff work')}${metric('Total files',db.clients.length,'Fictional records')}</div><div class="card"><h2>Review checklist</h2><p class="muted small">This is an administrative completeness check, not a tax-law review, calculation validation, or filing approval.</p>${table(['Client','Flags','Next step'],flagged.map(({c,f})=>`<tr><td>${esc(c.name)}</td><td style="white-space:normal">${f.map(x=>`<div class="warningline">⚠ ${esc(x)}</div>`).join('')}</td><td>${btn('Resolve',`openClient(${c.id})`,'alt sm')}</td></tr>`))}</div>`}
function intakePage(){let questions=[['contact','Preferred contact method','select',['Phone','Email','Office visit']],['income','Income sources (select best match)','select',['W-2 employment','Self-employment','Business ownership','Retirement / investments','Multiple sources']],['changes','Major changes this tax year','select',['No major changes','Moved / changed address','Marriage / divorce','New dependent','Started a business','Other']],['meeting','Preferred appointment','select',['In person','Phone call','Video call']],['notes','Questions for the office (fictional examples only)','text',[]]];return header('Client intake builder','A guided questionnaire that reduces back-and-forth')+`<div class="two"><div class="card"><h2>Start a fictional intake</h2><p class="muted small">For demonstration only. Do not enter real names, contact details, SSNs, income amounts, or tax data.</p><label>Return type<select class="field" id="intakeType">${selectOpts(types)}</select></label><div class="formgrid" style="margin-top:16px">${questions.map(([id,l,t,opts])=>`<label>${l}${t==='select'?`<select class="field" id="int_${id}">${selectOpts(opts)}</select>`:`<input class="field" id="int_${id}" placeholder="Fictional notes only">`}</label>`).join('')}</div><div class="toolbar" style="margin-top:18px">${btn('Generate intake summary',"makeIntake()",'primary')}</div></div><div class="card"><h2>Intake summary</h2><div id="intakeResult" class="empty">Complete the short questionnaire to see a checklist and staff handoff summary.</div></div></div>`}
function makeIntake(){let t=$('#intakeType').value,contact=$('#int_contact').value,income=$('#int_income').value,changes=$('#int_changes').value,meeting=$('#int_meeting').value,notes=$('#int_notes').value;let summary=`Return type: ${t}\nPreferred contact: ${contact}\nIncome source: ${income}\nLife changes: ${changes}\nMeeting preference: ${meeting}\nNotes: ${notes||'None'}\n\nSuggested initial checklist:\n${docTemplates[t].map(x=>'• '+x).join('\n')}\n\nStaff should confirm applicability and requirements.`;$('#intakeResult').innerHTML=`<pre class="summarypre">${esc(summary)}</pre>${btn('Copy summary',`navigator.clipboard?.writeText(document.getElementById('intakeRaw').value).then(()=>alert('Copied'))`,'primary')}<textarea id="intakeRaw" hidden>${esc(summary)}</textarea>`}
function revenuePage(){let pipeline=db.clients.length,done=db.clients.filter(c=>['Completed','Accepted'].includes(c.status)).length;return header('Growth & service opportunities','Improve service without aggressive selling')+`<div class="grid">${metric('Client relationships',pipeline,'Demo client records')}${metric('Completed / accepted',done,'Staff-entered statuses')}${metric('Active appointments',db.appointments.length,'Local demo bookings')}${metric('Potential follow-ups',db.clients.filter(c=>pending(c)).length,'Service conversations')}</div><div class="two"><div class="card"><h2>Service opportunities</h2><div class="stack">${[['Tax planning consultation','Offer a post-filing planning appointment where appropriate.'],['Bookkeeping support','Ask business owners whether they need monthly record organization.'],['Estimated tax check-in','Offer to review estimated-payment planning for applicable clients.'],['Referral experience','After a completed engagement, ask satisfied clients for feedback or referrals.']].map(([h,p])=>`<div class="item"><div><b>${h}</b><p class="muted small">${p}</p></div></div>`).join('')}</div></div><div class="card"><h2>Simple capacity dashboard</h2>${db.staff.map(s=>`<div class="barrow"><span>${esc(s)}</span><div class="progress"><div style="width:${pct(db.clients.filter(c=>c.staff===s).length,Math.max(1,db.clients.length))}%"></div></div><b>${db.clients.filter(c=>c.staff===s).length}</b></div>`).join('')}<p class="muted small">Counts are not revenue projections. No prices, tax outcomes, or conversions are assumed.</p></div></div>`}
function assistantAnswer(q){let s=q.toLowerCase();if(/missing|document|follow.up|remind/.test(s)){let cs=priorityClients().filter(c=>c.open);return `${cs.length} fictional clients have outstanding checklist items. The top three are ${cs.slice(0,3).map(c=>c.name+' ('+c.open+')').join(', ')}. Open Follow-up studio to prepare staff-reviewed reminders.`}if(/task|today|priority|busy|stress|start/.test(s)){let due=db.tasks.filter(t=>!t.done&&t.due<=today());return `Suggested priority order: (1) address ${due.length} due or overdue tasks; (2) review ${count('Ready for review')} returns ready for review; (3) follow up on ${db.clients.filter(c=>pending(c)).length} clients with outstanding items. Use the Tax season cockpit for shortcuts.`}if(/staff|workload|assign/.test(s))return db.staff.map(n=>`${n}: ${db.clients.filter(c=>c.staff===n).length} client files`).join('\n')+'. Check availability before reassigning.';if(/review|quality|error|check/.test(s))return `${db.clients.filter(c=>qualityFlags(c).length).length} fictional files have administrative workflow warnings. Open Quality control to inspect them. This is not a tax accuracy or compliance determination.`;if(/appointment|schedule|meeting/.test(s))return `There are ${db.appointments.length} demo appointments. Open Appointments to manage them. No calendar invites are sent.`;if(/sales|grow|revenue|service/.test(s))return 'Try optional tax planning check-ins, bookkeeping conversations, and service feedback. The Growth & service page has examples. Avoid assuming client eligibility or promising savings.';if(/security|secure|privacy|upload/.test(s))return 'This GitHub Pages prototype is NOT secure for real taxpayer data. Production requires a protected server, verified user authentication and authorization, encryption, monitored audit logs, secure file handling, and a documented information-security program.';if(/hello|hi|help|what can/.test(s))return 'I can summarize priorities, missing documents, staff workload, review flags, appointments, service opportunities, and security limitations. Try “What should we do today?”';return 'I can help with office workflow using fictional demo records. Try asking about priorities, missing documents, quality checks, workload, appointments, or follow-ups. I do not provide tax advice or connect to an external AI service.'}
function assistantPage(){return header('HQ Workflow Assistant','Instant answers from your fictional office data — no API key required')+`<div class="two"><div class="card"><h2>Ask a question</h2><div class="chatlog" id="chatlog">${assistantHistory.map(m=>`<div class="chatbubble ${m.role==='user'?'mine':''}"><b>${m.role==='user'?'You':'Workflow Assistant'}</b><p>${esc(m.text)}</p></div>`).join('')}</div><form onsubmit="askAssistant(event)" class="toolbar"><input class="field" style="flex:1;min-width:150px" id="askInput" placeholder="What should we focus on today?" required>${btn('Ask',"",'primary').replace('<button','<button type="submit"').replace('onclick=""','')}</form><p class="muted small">Rule-based assistant, not a generative AI model. It never sends your entries to an AI provider. Do not enter sensitive information.</p></div><div class="card"><h2>Suggested prompts</h2><div class="actiongrid">${['What should we do today?','Who is missing documents?','How is staff workload?','Which files need quality checks?','How can we improve service?','Is this website secure?'].map(x=>btn(esc(x),`quickAsk(${JSON.stringify(x).replace(/"/g,'&quot;')})`)).join('')}</div><div class="notice" style="margin-top:20px"><b>Future AI upgrade</b><p>A true generative chatbot requires a secure backend, server-held API credentials, approved data handling, and staff oversight. Never put an API key in public GitHub HTML.</p></div></div></div>`}
function askAssistant(e){e.preventDefault();let q=$('#askInput').value.trim();if(!q)return;quickAsk(q)}function quickAsk(q){assistantHistory.push({role:'user',text:q},{role:'assistant',text:assistantAnswer(q)});go('assistant');let log=$('#chatlog');if(log)log.scrollTop=log.scrollHeight}

const pages={season:seasonPage,followups:followupsPage,quality:qualityPage,intake:intakePage,growth:revenuePage,assistant:assistantPage,dashboard:dashboard,clients:clientsPage,detail:detail,tasks:tasksPage,messages:messagesPage,appointments:appointmentsPage,analytics:analyticsPage,staff:staffPage,audit:auditPage,portal:portal,settings:settingsPage};const nav=[['season','⚡','Tax season cockpit'],['assistant','✦','Workflow assistant'],['followups','✉','Follow-up studio'],['intake','▤','Intake builder'],['quality','✓','Quality control'],['growth','↗','Growth & service'],['dashboard','▦','Dashboard'],['clients','♙','Clients & returns'],['tasks','☑','Task center'],['messages','✉','Communications'],['appointments','▣','Appointments'],['analytics','▥','Analytics'],['staff','♧','Staff'],['audit','◷','Activity history'],['portal','◉','Client portal preview'],['settings','⚙','Demo settings']];function go(v){view=v;modal='';render();window.scrollTo(0,0)}function render(){document.getElementById('app').innerHTML=`<div class="shell"><aside class="side" id="sidebar"><div class="brand">◇ HQ Tax</div><div class="subbrand">FINANCIAL COMMAND CENTER</div>${nav.map(([v,ic,label])=>`<button class="nav ${view===v?'active':''}" onclick="go('${v}');$('#sidebar').classList.remove('show')">${ic} &nbsp; ${label}</button>`).join('')}<div class="sidefoot">● Interactive training prototype<br>Not approved for real taxpayer data</div></aside><main class="main"><div class="top"><div class="flex"><button class="btn alt hamb" onclick="$('#sidebar').classList.toggle('show')">☰</button><strong>Tax Office Command Center</strong><span class="pill green">DEMO</span></div><div class="topright"><span class="muted small">Fictional records only</span>${btn('Client view',"go('portal')")}</div></div><div class="content"><div class="notice"><b>TRAINING ENVIRONMENT:</b> Do not enter real taxpayer names, SSNs, financial information, or upload sensitive documents. This website has no secure backend.</div>${(pages[view]||dashboard)()}</div></main></div>${modalHtml()}`};render();
